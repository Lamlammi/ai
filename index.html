<!DOCTYPE html>
<html lang="ko" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Creative Agent Team</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --border-color: rgba(255, 255, 255, 0.4);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
                --card-bg: #1e293b;
                --shadow-color: rgba(0, 0, 0, 0.4);
                --border-color: rgba(255, 255, 255, 0.08);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            height: 100%;
            margin: 0;
            background: var(--bg-gradient);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .chat-container {
            width: 100%;
            max-width: 1200px;
            height: 100%;
            max-height: 850px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px var(--shadow-color);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .chat-header {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            background: inherit;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }

        .chat-title {
            font-size: 14px;
            font-weight: 600;
            color: inherit;
            opacity: 0.85;
            letter-spacing: -0.3px;
        }

        .iframe-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
        }

        /* 반응형 스타일 (모바일 환경) */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }
            .chat-container {
                max-height: 100%;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="status-dot"></div>
            <div class="chat-title">AI Creative Agent Team</div>
        </div>
        <div class="iframe-wrapper">
            <iframe src="https://copilotstudio.microsoft.com/environments/Default-9ef36566-f756-4f11-9c5f-307c10f409f9/bots/cre46_aicreativeagentteam_xOtQd7/webchat?__version__=2&enableFileAttachment=false&cliAgent=true" frameborder="0"></iframe>
        </div>
    </div>
</body>
</html>
